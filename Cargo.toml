[package]
name = "togi"
version = "0.1.0"
edition = "2024"
autotests = false

[[test]]
name = "e2e"
path = "tests/e2e.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[dev-dependencies]
pretty_assertions = "1.4"
rstest = "0.26"
tempfile = "3.22"
# 复用已有依赖的 test-utils feature（MockCompletionModel），不新增依赖。
rig = { version = "0.40.0", features = ["test-utils"] }

[dependencies]
arboard = "3.6.1"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6"
fluent = "0.17.0"
unic-langid = "0.9.6"
futures = "0.3"
itertools = "0.14.0"
http = "1"
libc = "0.2"
pulldown-cmark = "0.13.4"
ratatui = "0.30.1"
rig = "0.40.0"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
similar = "3.1.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
thiserror = "2.0.18"
unicode-width = "0.2"
strsim = "0.11"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "process", "time", "fs", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
toml = "1.1.2"
encoding_rs = "0.8.35"
turso = "0.7.0"
uuid = { version = "1.24.0", features = ["v4"] }
tui-widgets = "0.7.10"
ratatui-textarea = "0.9.2"
